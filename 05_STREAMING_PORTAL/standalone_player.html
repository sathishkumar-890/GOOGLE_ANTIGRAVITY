<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus IPTV & Live Streams (YouTube Style)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
:root {
  --bg-main: #0a0e17;
  --bg-card: rgba(18, 24, 38, 0.75);
  --bg-card-hover: rgba(28, 38, 58, 0.9);
  --border-color: rgba(255, 255, 255, 0.08);
  --text-main: #f3f4f6;
  --text-muted: #9ca3af;
  --accent-primary: #3b82f6;
  --accent-red: #ef4444;
  --accent-glow: rgba(59, 130, 246, 0.35);
  --danger: #ef4444;
  --success: #10b981;
  --warning: #f59e0b;
  --font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: radial-gradient(circle at 20% 20%, #111827 0%, #07090e 100%);
  color: var(--text-main);
  font-family: var(--font-family);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* Top Navbar */
.navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.85rem 2rem;
  background: rgba(10, 14, 23, 0.85);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border-color);
  position: sticky;
  top: 0;
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.brand-badge {
  font-size: 0.65rem;
  font-weight: 700;
  background: linear-gradient(135deg, #ef4444, #f97316);
  color: #fff;
  padding: 0.2rem 0.5rem;
  border-radius: 9999px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.nav-search {
  position: relative;
  width: 320px;
}
.nav-search input {
  width: 100%;
  padding: 0.6rem 1rem 0.6rem 2.4rem;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-color);
  border-radius: 9999px;
  color: #fff;
  font-size: 0.85rem;
  outline: none;
  transition: all 0.2s ease;
}
.nav-search input:focus {
  background: rgba(255, 255, 255, 0.1);
  border-color: var(--accent-red);
  box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.35);
}
.nav-search svg {
  position: absolute;
  left: 0.85rem;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  fill: var(--text-muted);
}
.nav-user-menu {
  display: flex;
  align-items: center;
  gap: 1.25rem;
}
.nav-link {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 0.85rem;
  font-weight: 500;
  transition: color 0.2s;
}
.nav-link:hover { color: #fff; }
.nav-user { font-size: 0.82rem; color: var(--text-muted); }

/* Main Grid Layout */
.app-container {
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 1.5rem;
  padding: 1.5rem 2rem;
  max-width: 1600px;
  width: 100%;
  margin: 0 auto;
  flex: 1;
}

@media (max-width: 1100px) {
  .app-container { grid-template-columns: 1fr; }
}

/* Left Column: Player & Studio */
.player-section {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

/* -------------------------------------------------------------
   YOUTUBE-STYLE VIDEO VIEWPORT & CUSTOM CONTROLS
------------------------------------------------------------- */
.video-viewport {
  position: relative;
  background: #000;
  border-radius: 1rem;
  overflow: hidden;
  border: 1px solid var(--border-color);
  box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
  aspect-ratio: 16 / 9;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
  display: block;
}

/* YouTube Big Center Play/Pause Ripple Button */
.yt-center-action {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
  z-index: 20;
}
.yt-center-btn {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.75);
  border: 2px solid rgba(255, 255, 255, 0.3);
  backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
}
.yt-center-icon {
  width: 36px;
  height: 36px;
  fill: #fff;
}
.yt-center-action.show-briefly {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1.15);
}

/* Recording Badge Overlay */
.rec-overlay {
  position: absolute;
  top: 1rem;
  left: 1rem;
  display: none;
  align-items: center;
  gap: 0.5rem;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(8px);
  padding: 0.4rem 0.85rem;
  border-radius: 9999px;
  border: 1px solid rgba(239, 68, 68, 0.5);
  z-index: 30;
  font-size: 0.8rem;
  font-weight: 700;
  color: #fff;
}
.rec-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--danger);
  box-shadow: 0 0 10px var(--danger);
  animation: pulse 1s infinite alternate;
}
@keyframes pulse {
  from { opacity: 0.3; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1.1); }
}

/* YouTube Bottom Control Bar Wrapper */
.yt-controls-wrapper {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.6) 60%, transparent 100%);
  padding: 0 1rem 0.75rem 1rem;
  z-index: 25;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  transition: opacity 0.25s ease;
  opacity: 1;
}

/* Auto-hide controls when playing & idle */
.video-viewport.yt-idle .yt-controls-wrapper {
  opacity: 0;
  pointer-events: none;
}

/* Red Scrubber / Progress Line */
.yt-progress-track {
  width: 100%;
  height: 4px;
  background: rgba(255, 255, 255, 0.25);
  border-radius: 2px;
  position: relative;
  overflow: hidden;
}
.yt-progress-line {
  height: 100%;
  width: 100%;
  background: var(--accent-red);
  box-shadow: 0 0 8px var(--accent-red);
}

.yt-controls-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.yt-controls-left, .yt-controls-right {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.yt-btn {
  background: transparent;
  border: none;
  color: #fff;
  cursor: pointer;
  padding: 0.4rem;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  outline: none;
}
.yt-btn:hover {
  background: rgba(255, 255, 255, 0.15);
  transform: scale(1.08);
}
.yt-icon {
  width: 24px;
  height: 24px;
  fill: #fff;
}

/* Volume Group */
.yt-volume-group {
  display: flex;
  align-items: center;
  gap: 0.2rem;
}
.yt-volume-range {
  width: 60px;
  height: 4px;
  accent-color: #fff;
  cursor: pointer;
  opacity: 0.85;
  transition: opacity 0.2s, width 0.2s;
}
.yt-volume-range:hover { opacity: 1; width: 75px; }

/* Live Pill Indicator */
.yt-live-pill {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  font-size: 0.72rem;
  font-weight: 800;
  color: #fff;
  background: rgba(239, 68, 68, 0.25);
  border: 1px solid rgba(239, 68, 68, 0.4);
  padding: 0.2rem 0.55rem;
  border-radius: 4px;
  letter-spacing: 0.06em;
  margin-left: 0.4rem;
}
.yt-live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent-red);
  box-shadow: 0 0 6px var(--accent-red);
}

/* Resolution / Quality Button & Popover */
.yt-quality-container {
  position: relative;
}
.yt-quality-btn {
  border-radius: 0.4rem !important;
  padding: 0.3rem 0.6rem !important;
  gap: 0.35rem;
  font-weight: 700;
  font-size: 0.75rem;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
}
.yt-quality-btn:hover {
  background: rgba(255, 255, 255, 0.2);
}
.yt-quality-text {
  font-size: 0.72rem;
  letter-spacing: 0.05em;
  color: #fff;
}

/* Quality Menu Dropdown (Pop up upwards) */
.yt-quality-dropdown {
  position: absolute;
  bottom: calc(100% + 12px);
  right: 0;
  background: rgba(18, 24, 38, 0.96);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 0.75rem;
  min-width: 170px;
  padding: 0.5rem 0;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
  display: none;
  flex-direction: column;
  z-index: 50;
  animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.yt-quality-dropdown.show { display: flex; }
@keyframes popIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.yt-quality-title {
  padding: 0.4rem 1rem 0.5rem 1rem;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border-bottom: 1px solid var(--border-color);
  margin-bottom: 0.3rem;
}
.yt-quality-item {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.5rem 1rem;
  font-size: 0.82rem;
  color: var(--text-main);
  cursor: pointer;
  transition: background 0.15s;
}
.yt-quality-item:hover {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
}
.yt-quality-item.active {
  color: var(--accent-red);
  font-weight: 700;
}
.yt-check {
  font-size: 0.85rem;
  width: 16px;
  text-align: center;
  visibility: hidden;
}
.yt-quality-item.active .yt-check { visibility: visible; }

/* -------------------------------------------------------------
   STREAM HEADER & STUDIO TOOLS
------------------------------------------------------------- */
.stream-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1rem;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 0.85rem;
  padding: 1rem 1.25rem;
  backdrop-filter: blur(12px);
}
.current-channel-info {
  display: flex;
  align-items: center;
  gap: 1rem;
}
.channel-logo-display {
  width: 44px;
  height: 44px;
  border-radius: 0.6rem;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 1.1rem;
  color: var(--accent-red);
}
.channel-meta h3 {
  font-size: 1.1rem;
  font-weight: 700;
  line-height: 1.2;
}
.channel-meta p {
  font-size: 0.75rem;
  color: var(--text-muted);
  font-family: monospace;
  margin-top: 0.2rem;
  max-width: 450px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.studio-actions {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  flex-wrap: wrap;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  padding: 0.55rem 1rem;
  border-radius: 0.6rem;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.2s ease;
  user-select: none;
}
.btn-record {
  background: rgba(239, 68, 68, 0.15);
  border-color: rgba(239, 68, 68, 0.35);
  color: #f87171;
}
.btn-record:hover {
  background: var(--danger);
  color: #fff;
  box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
}
.btn-record.recording {
  background: var(--danger);
  color: #fff;
  animation: pulse 1s infinite alternate;
}
.btn-secondary {
  background: rgba(255, 255, 255, 0.06);
  border-color: var(--border-color);
  color: var(--text-main);
}
.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.2);
}

/* -------------------------------------------------------------
   RIGHT SIDEBAR: CHANNELS & CATEGORIES
------------------------------------------------------------- */
.sidebar-panel {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 1rem;
  padding: 1.25rem;
  backdrop-filter: blur(16px);
  display: flex;
  flex-direction: column;
  gap: 1rem;
  max-height: calc(100vh - 120px);
}

.category-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 0.45rem;
  flex-shrink: 0;
  width: 100%;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--border-color);
}
.pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0.42rem 0.85rem;
  border-radius: 9999px;
  font-size: 0.76rem;
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border-color);
  color: #cbd5e1;
  transition: all 0.2s ease;
  user-select: none;
}
.pill:hover {
  background: rgba(255, 255, 255, 0.15);
  color: #fff;
  border-color: rgba(255, 255, 255, 0.25);
  transform: translateY(-1px);
}
.pill.active {
  background: var(--accent-red);
  color: #fff;
  border-color: var(--accent-red);
  box-shadow: 0 0 14px rgba(239, 68, 68, 0.4);
}

.channels-scroll-list {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 0.65rem;
  overflow-y: auto;
  padding-right: 0.3rem;
}
.channels-scroll-list::-webkit-scrollbar { width: 5px; }
.channels-scroll-list::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.15);
  border-radius: 4px;
}

.channel-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 0.85rem 0.5rem;
  border-radius: 0.75rem;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border-color);
  cursor: pointer;
  transition: all 0.2s ease;
  position: relative;
}
.channel-card:hover {
  background: var(--bg-card-hover);
  border-color: rgba(239, 68, 68, 0.5);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
}
.channel-card.active {
  background: rgba(239, 68, 68, 0.12);
  border-color: var(--accent-red);
  box-shadow: 0 0 16px rgba(239, 68, 68, 0.35);
}
.channel-card.active::before {
  content: '';
  position: absolute;
  top: 0.4rem;
  right: 0.4rem;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 8px var(--success);
}
.channel-card-icon {
  font-size: 1.6rem;
  margin-bottom: 0.4rem;
}
.channel-card-title {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-main);
  line-height: 1.2;
}
.channel-card-tag {
  font-size: 0.65rem;
  color: var(--text-muted);
  margin-top: 0.25rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* Toast Container */
.toast-container {
  position: fixed;
  bottom: 2rem;
  right: 2rem;
  z-index: 999;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.toast {
  background: rgba(17, 24, 39, 0.95);
  border: 1px solid var(--border-color);
  backdrop-filter: blur(16px);
  padding: 0.75rem 1.25rem;
  border-radius: 0.6rem;
  font-size: 0.85rem;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: center;
  gap: 0.6rem;
  animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

  </style>
</head>
<body>

  <!-- Top Navigation -->
  <nav class="navbar">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
      <span>NEXUS STREAM</span>
      <span class="brand-badge">PRO IPTV</span>
    </div>

    <div class="nav-search">
      <svg viewBox="0 0 24 24"><path d="M21.71 20.29l-5.4-5.4a8 8 0 1 0-1.42 1.42l5.4 5.4a1 1 0 0 0 1.42-1.42zM10 16a6 6 0 1 1 6-6 6 6 0 0 1-6 6z"/></svg>
      <input type="text" id="channelSearch" placeholder="Search 30+ channels..." oninput="filterChannels()">
    </div>

    <div class="nav-user-menu">
      <span class="nav-user">User: <strong>user</strong></span>
      <span class="btn btn-secondary" style="font-size: 0.75rem;">Offline Mode</span>
    </div>
  </nav>

  <!-- App Layout -->
  <div class="app-container">
    
    <!-- Left Column: Player & Studio -->
    <div class="player-section">
      <div class="video-viewport" id="videoViewport">
        
        <!-- Live Recording Indicator -->
        <div id="recOverlay" class="rec-overlay">
          <div class="rec-dot"></div>
          <span>REC</span>
          <span id="recTimer" style="font-family: monospace;">00:00</span>
        </div>

        <video id="players" playsinline></video>

        <!-- Big Center Play / Pause (YouTube Style) -->
        <div class="yt-center-action" id="ytCenterAction">
          <div class="yt-center-btn" id="ytCenterBtn">
            <svg class="yt-center-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>

        <!-- YouTube Style Bottom Control Bar -->
        <div class="yt-controls-wrapper" id="ytControlsWrapper">
          <div class="yt-progress-track">
            <div class="yt-progress-line" id="ytProgressLine"></div>
          </div>

          <div class="yt-controls-bar">
            <!-- Left Controls -->
            <div class="yt-controls-left">
              <button class="yt-btn" id="ytPlayBtn" title="Play (Space)">
                <svg class="yt-icon" id="ytPlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              </button>

              <div class="yt-volume-group">
                <button class="yt-btn" id="ytMuteBtn" title="Mute (M)">
                  <svg class="yt-icon" id="ytVolIcon" viewBox="0 0 24 24">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                  </svg>
                </button>
                <input type="range" class="yt-volume-range" id="ytVolRange" min="0" max="1" step="0.05" value="1" title="Volume">
              </div>

              <div class="yt-live-pill">
                <span class="yt-live-dot"></span>
                <span>LIVE</span>
              </div>
            </div>

            <!-- Right Controls: Resolution, PiP, Fullscreen -->
            <div class="yt-controls-right">
              
              <!-- Resolution Selector -->
              <div class="yt-quality-container">

function filterChannels() {

  const filtered = channelData.filter(ch => {
    const matchCat = (currentFilter === 'all' || ch.cat.toLowerCase() === currentFilter.toLowerCase());
    const matchQuery = ch.name.toLowerCase().includes(q) || ch.cat.toLowerCase().includes(q);
    return matchCat && matchQuery;
  });
  renderChannels(filtered);
}

// --- 2. HLS PLAYBACK & DYNAMIC RESOLUTION ---
function playStream(url) {
  const video = document.getElementById('players');
  if (!video) return;

  if (currentHls) {
    currentHls.destroy();
    currentHls = null;
  }

  // Reset quality options
  resetQualityMenu();

  if (Hls.isSupported()) {
    const hls = new Hls({
      enableWorker: true,
      lowLatencyMode: true,
      backBufferLength: 60
    });
    currentHls = hls;
    hls.loadSource(url);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
      populateQualityMenu(data.levels);
      video.play().then(() => updatePlayIcon(true)).catch(() => updatePlayIcon(false));
    });

    hls.on(Hls.Events.LEVEL_SWITCHED, (event, data) => {
      const level = hls.levels[data.level];
      if (level && currentLevelIndex === -1) {
        document.getElementById('ytQualityText').innerText = `AUTO (${level.height}p)`;
      }
    });

    hls.on(Hls.Events.ERROR, (event, data) => {
      if (data.fatal) {
        switch(data.type) {
          case Hls.ErrorTypes.NETWORK_ERROR:
            hls.startLoad();
            break;
          case Hls.ErrorTypes.MEDIA_ERROR:
            hls.recoverMediaError();
            break;
          default:
            hls.destroy();
            break;
        }
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
    video.play();
    updatePlayIcon(true);
  }
}

function resetQualityMenu() {
  const list = document.getElementById('ytQualityOptions');
  if (!list) return;
  list.innerHTML = `
    <div class="yt-quality-item active" onclick="setResolution(-1, 'Auto')">
      <span class="yt-check">✓</span>
      <span>Auto</span>
    </div>
  `;
  document.getElementById('ytQualityText').innerText = 'AUTO';
  currentLevelIndex = -1;
}

function populateQualityMenu(levels) {
  const list = document.getElementById('ytQualityOptions');
  if (!list || !levels || levels.length === 0) return;

  list.innerHTML = `
    <div class="yt-quality-item ${currentLevelIndex === -1 ? 'active' : ''}" onclick="setResolution(-1, 'Auto')">
      <span class="yt-check">✓</span>
      <span>Auto (Multi-bitrate)</span>
    </div>
  `;

  // Sort descending by height
  const sorted = levels.map((lvl, idx) => ({ ...lvl, origIdx: idx }))
                       .sort((a, b) => (b.height || 0) - (a.height || 0));

  sorted.forEach(lvl => {
    const height = lvl.height || Math.round((lvl.bitrate || 0) / 1000);
    const label = height > 700 ? `${height}p HD` : `${height}p`;
    const item = document.createElement('div');
    item.className = `yt-quality-item ${currentLevelIndex === lvl.origIdx ? 'active' : ''}`;
    item.onclick = (e) => {
      e.stopPropagation();
      setResolution(lvl.origIdx, label);
    };
    item.innerHTML = `
      <span class="yt-check">✓</span>
      <span>${label}</span>
    `;
    list.appendChild(item);
  });
}

function setResolution(levelIndex, label) {
  if (!currentHls) return;
  currentHls.currentLevel = levelIndex;
  currentLevelIndex = levelIndex;

  document.getElementById('ytQualityText').innerText = label.toUpperCase();

  // Update active checkmarks
  const items = document.querySelectorAll('.yt-quality-item');
  items.forEach(it => it.classList.remove('active'));
  if (event && event.currentTarget) {
    event.currentTarget.classList.add('active');
  }

  toggleQualityDropdown(false);
  showToast(`📺 Resolution switched to: ${label}`);
}

function toggleQualityDropdown(forceState) {
  const dropdown = document.getElementById('ytQualityDropdown');
  if (!dropdown) return;
  const isShow = forceState !== undefined ? forceState : !dropdown.classList.contains('show');
  if (isShow) dropdown.classList.add('show');
  else dropdown.classList.remove('show');
}

function togglePlayPause() {
  const video = document.getElementById('players');
  if (!video) return;
  if (video.paused) {
    video.play();
    updatePlayIcon(true);
    triggerCenterAnimation(true);
  } else {
    video.pause();
    updatePlayIcon(false);
    triggerCenterAnimation(false);
  }
}

function updatePlayIcon(isPlaying) {
  const icon = document.getElementById('ytPlayIcon');
  if (!icon) return;
  if (isPlaying) {
    icon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; // Pause icon

}

function triggerCenterAnimation(isPlaying) {
  const wrap = document.getElementById('ytCenterAction');
  const btn = document.getElementById('ytCenterBtn');
  if (!wrap || !btn) return;

}

function setVolume(val) {

}

function toggleMute() {
  const video = document.getElementById('players');

// --- 5. STREAM RECORDER (SAVE MP4/WEBM LOCALLY) ---
let mediaRecorder = null;
let recordedChunks = [];
let isRecording = false;
let recordStartTime = null;
let recordInterval = null;

function getSupportedMimeType() {
  const types = [
    'video/mp4;codecs=avc1,mp4a.40.2',
    'video/mp4',
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm'
  ];
  for (const t of types) {
    if (MediaRecorder.isTypeSupported(t)) return t;
  }
  return '';
}

function toggleRecording() {
  if (!isRecording) startRecording();
  else stopRecording();
}

function startRecording() {
  const video = document.getElementById('players');
  const stream = video.captureStream ? video.captureStream() : (video.mozCaptureStream ? video.mozCaptureStream() : null);

  if (!stream) {
    showToast('❌ Browser does not support stream capture.');
    return;
  }

  const mimeType = getSupportedMimeType();
  recordedChunks = [];

  try {
    mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
  } catch (err) {
    showToast('❌ MediaRecorder error: ' + err.message);
    return;
  }

  mediaRecorder.ondataavailable = (e) => {
    if (e.data && e.data.size > 0) recordedChunks.push(e.data);
  };

  mediaRecorder.onstop = saveRecordedFile;
  mediaRecorder.start(1000);
  isRecording = true;
  recordStartTime = Date.now();

  const btn = document.getElementById('btnRecord');
  btn.classList.add('recording');
  document.getElementById('recBtnLabel').innerText = 'Stop & Save Video';
  document.getElementById('recOverlay').style.display = 'flex';

  recordInterval = setInterval(updateRecTimer, 500);
  showToast('⏺️ Recording started...');
}

function updateRecTimer() {
  const diff = Math.floor((Date.now() - recordStartTime) / 1000);
  const mins = String(Math.floor(diff / 60)).padStart(2, '0');
  const secs = String(diff % 60).padStart(2, '0');
  document.getElementById('recTimer').innerText = `${mins}:${secs}`;
}

function stopRecording() {
  if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
  mediaRecorder.stop();
  isRecording = false;
  clearInterval(recordInterval);

  const btn = document.getElementById('btnRecord');
  btn.classList.remove('recording');
  document.getElementById('recBtnLabel').innerText = 'Record Stream (MP4)';
  document.getElementById('recOverlay').style.display = 'none';
  document.getElementById('recTimer').innerText = '00:00';
}

function saveRecordedFile() {
  const mimeType = mediaRecorder.mimeType || 'video/mp4';
  const isMp4 = mimeType.includes('mp4');
  const ext = isMp4 ? 'mp4' : 'webm';
  const blob = new Blob(recordedChunks, { type: mimeType });

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const timeStr = new Date().toISOString().replace(/[:.]/g, '-');
  a.href = url;
  a.download = `${activeChannel.name.replace(/\s+/g, '_')}_Record_${timeStr}.${ext}`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);

  showToast(`✅ Saved ${a.download} (${(blob.size / (1024 * 1024)).toFixed(2)} MB) to your PC!`);
}

function takeSnapshot() {
  const video = document.getElementById('players');
  if (!video.videoWidth || !video.videoHeight) {
    showToast('⚠️ No active video frame to capture.');
    return;
  }
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  const a = document.createElement('a');
  const timeStr = new Date().toISOString().replace(/[:.]/g, '-');
  a.href = canvas.toDataURL('image/png');
  a.download = `${activeChannel.name.replace(/\s+/g, '_')}_Snapshot_${timeStr}.png`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  showToast(`📸 Snapshot saved: ${a.download}`);
}

function showToast(msg) {
  const tc = document.getElementById('toastContainer');
  if (!tc) return;
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = msg;
  tc.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translateY(10px)';
    t.style.transition = 'all 0.3s';
    setTimeout(() => tc.removeChild(t), 300);
  }, 3500);
}

// Global Shortcuts & Events Setup
window.addEventListener('DOMContentLoaded', () => {
  renderChannels(channelData);
  switchChannel(channelData[0]);

  const vp = document.getElementById('videoViewport');
  const video = document.getElementById('players');
  const playBtn = document.getElementById('ytPlayBtn');
  const muteBtn = document.getElementById('ytMuteBtn');
  const volRange = document.getElementById('ytVolRange');
  const qualityBtn = document.getElementById('ytQualityBtn');

  if (playBtn) playBtn.onclick = (e) => { e.stopPropagation(); togglePlayPause(); };
  if (muteBtn) muteBtn.onclick = (e) => { e.stopPropagation(); toggleMute(); };
  if (volRange) volRange.oninput = (e) => { e.stopPropagation(); setVolume(parseFloat(e.target.value)); };
  if (qualityBtn) qualityBtn.onclick = (e) => { e.stopPropagation(); toggleQualityDropdown(); };

  // Click video viewport to play/pause
  if (vp) {
    vp.onclick = (e) => {
      // Don't toggle if clicking inside controls or quality menu
      if (e.target.closest('.yt-controls-wrapper')) return;
      togglePlayPause();
    };
    vp.ondblclick = (e) => {
      if (e.target.closest('.yt-controls-wrapper')) return;
      toggleFullscreen();
    };
    vp.onmousemove = handleUserActivity;
    vp.onmouseleave = () => {
      if (video && !video.paused) vp.classList.add('yt-idle');
    };
  }

  // Close quality dropdown when clicking outside
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.yt-quality-container')) {
      toggleQualityDropdown(false);
    }
  });

  // Keyboard Shortcuts
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') {
      e.preventDefault();
      togglePlayPause();
    } else if (e.code === 'KeyF') {
      e.preventDefault();
      toggleFullscreen();
    } else if (e.code === 'KeyM') {
      e.preventDefault();
      toggleMute();
    } else if (e.code === 'KeyR') {
      e.preventDefault();
      toggleRecording();
    } else if (e.code === 'KeyS') {
      e.preventDefault();
      takeSnapshot();
    }
  });
});

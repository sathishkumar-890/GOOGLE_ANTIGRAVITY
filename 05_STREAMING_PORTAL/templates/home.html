{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Stream - Live Portal</title>
    <link rel="shortcut icon" type="image/png" href="{% static 'images/owl.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: rgba(15, 23, 42, 0.75);
            --border-glow: rgba(255, 255, 255, 0.12);
            --primary-accent: #ef4444;
            --primary-gradient: linear-gradient(135deg, #ef4444, #f97316);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            min-height: 100%;
            width: 100%;
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .ambient-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.35;
            z-index: 1;
            animation: floatGlow 12s infinite alternate ease-in-out;
            pointer-events: none;
        }
        .glow-1 { top: 10%; left: 15%; width: 450px; height: 450px; background: radial-gradient(circle, #3b82f6 0%, transparent 70%); }
        .glow-2 { bottom: 10%; right: 15%; width: 500px; height: 500px; background: radial-gradient(circle, #ef4444 0%, transparent 70%); animation-duration: 15s; }
        .glow-3 { top: 40%; right: 35%; width: 350px; height: 350px; background: radial-gradient(circle, #8b5cf6 0%, transparent 70%); animation-duration: 10s; }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, -30px) scale(1.1); }
            100% { transform: translate(-30px, 40px) scale(0.95); }
        }

        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 1.25rem 2.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 50;
            background: rgba(7, 9, 14, 0.6);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glow);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            text-decoration: none;
            color: #fff;
        }
        .brand-badge {
            font-size: 0.65rem;
            font-weight: 800;
            background: var(--primary-gradient);
            padding: 0.2rem 0.55rem;
            border-radius: 9999px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 500;
            transition: color 0.2s;
        }
        .nav-link:hover { color: #fff; }

        .login-wrapper {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6rem 1.5rem 3rem 1.5rem;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--border-glow);
            border-radius: 1.5rem;
            padding: 2.75rem 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
            animation: cardEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(transparent, rgba(239, 68, 68, 0.25), transparent 30%);
            animation: rotateBorder 8s linear infinite;
            z-index: -1;
            pointer-events: none;
        }
        @keyframes rotateBorder { 100% { transform: rotate(360deg); } }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card-header { text-align: center; margin-bottom: 1.75rem; }
        .card-icon {
            width: 52px; height: 52px; margin: 0 auto 1rem auto;
            border-radius: 1rem; background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glow); display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        .card-title { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em; color: #fff; }
        .card-subtitle { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.35rem; }

        .form-group { margin-bottom: 1.25rem; }
        .form-label { display: block; font-size: 0.78rem; font-weight: 600; color: #cbd5e1; margin-bottom: 0.45rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .input-box { position: relative; display: flex; align-items: center; }
        .input-icon { position: absolute; left: 1rem; width: 18px; height: 18px; fill: var(--text-muted); pointer-events: none; transition: fill 0.2s; }

        input[type="text"], input[type="password"], input[type="email"] {
            width: 100%; padding: 0.85rem 1rem 0.85rem 2.75rem;
            background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-glow); border-radius: 0.75rem;
            color: #fff; font-size: 0.92rem; font-family: inherit; outline: none; transition: all 0.25s ease;
        }
        input:focus { background: rgba(255, 255, 255, 0.08); border-color: #ef4444; box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.25); }
        .input-box:focus-within .input-icon { fill: #ef4444; }

        .btn-submit {
            width: 100%; padding: 0.95rem; border-radius: 0.75rem; border: none;
            background: var(--primary-gradient); color: #fff; font-size: 0.95rem; font-weight: 700;
            cursor: pointer; transition: all 0.25s ease; box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.5);
            margin-top: 1rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; letter-spacing: 0.02em; text-decoration: none;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 15px 35px -5px rgba(239, 68, 68, 0.7); }

        .card-footer { margin-top: 1.5rem; text-align: center; font-size: 0.82rem; color: var(--text-muted); }
        .card-footer a { color: #f87171; text-decoration: none; font-weight: 600; transition: color 0.2s; }
        .card-footer a:hover { color: #fca5a5; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>

    <canvas id="bgCanvas"></canvas>

    <nav class="top-nav">
        <a href="{% url 'login' %}" class="brand">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <span>NEXUS STREAM</span>
            <span class="brand-badge">IPTV</span>
        </a>
        <div class="nav-links">
            <a href="{% url 'signup' %}" class="nav-link">Sign Up</a>
            <a href="{% url 'feedbacks' %}" class="nav-link">FeedBack</a>
        </div>
    </nav>

    {% block body_block %}
    <div class="login-wrapper">
        <div class="login-card">
            
            <div class="card-header">
                <div class="card-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"></path>
                        <polygon points="10 8 16 12 10 16 10 8"></polygon>
                    </svg>
                </div>
                <h1 class="card-title">Welcome Back</h1>
                <p class="card-subtitle">Log in to your streaming portal account</p>
            </div>

            {% if error_message %}
            <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 0.75rem 1rem; border-radius: 0.75rem; font-size: 0.85rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
                <span>⚠️</span>
                <span>{{ error_message }}</span>
            </div>
            {% endif %}

            <form action="{% url 'login' %}" method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label class="form-label">Username</label>
                    <div class="input-box">
                        <svg class="input-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                        <input type="text" name="Username" placeholder="Enter username" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-box">
                        <svg class="input-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                        <input type="password" name="Password" placeholder="Enter password" required autocomplete="current-password">
                    </div>
                </div>

                <button id="li" class="btn-submit" type="submit">
                    <span>Sign In</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>

                <div class="card-footer">
                    Don't have an account? <a href="{% url 'signup' %}">Create account</a>
                </div>
            </form>

        </div>
    </div>
    {% endblock %}

    <script>
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let w, h;
        function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        const particleCount = 70;
        const particles = [];
        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * w; this.y = Math.random() * h;
                this.vx = (Math.random() - 0.5) * 0.7; this.vy = (Math.random() - 0.5) * 0.7;
                this.radius = Math.random() * 2 + 1; this.alpha = Math.random() * 0.6 + 0.2;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0 || this.x > w) this.vx *= -1;
                if (this.y < 0 || this.y > h) this.vy *= -1;
            }
            draw() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(239, 68, 68, ${this.alpha})`; ctx.fill();
            }
        }
        for (let i = 0; i < particleCount; i++) particles.push(new Particle());

        function drawLines() {
            const maxDist = 130;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x; const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < maxDist) {
                        const alpha = (1 - dist / maxDist) * 0.25;
                        ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(249, 115, 22, ${alpha})`; ctx.lineWidth = 0.8; ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, w, h);
            for (let p of particles) { p.update(); p.draw(); }
            drawLines();
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
